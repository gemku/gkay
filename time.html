<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Time and Date</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom, #fdfcfb, #e2d1c3);
            color: #4a4a4a;
        }
        .time-container {
            text-align: center;
            padding: 2rem;
            border: 2px solid #d4a373;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .time-container h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #8b4513;
        }
        .time-container p {
            font-size: 1.5rem;
            margin: 0.5rem 0;
        }
        .time-container .date {
            font-size: 1.2rem;
            color: #6b6b6b;
        }
    </style>
</head>
<body>
    <div class="time-container">
        <h1>Current Time and Date</h1>
        <p id="date" class="date">Loading date...</p>
        <p id="time">Loading time...</p>
    </div>

    <script>
        function updateDateTime() {
            const timeElement = document.getElementById('time');
            const dateElement = document.getElementById('date');
            const now = new Date();

            // Format time
            const timeString = now.toLocaleTimeString();

            // Format date
            const dateString = now.toLocaleDateString(undefined, {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // Update elements
            timeElement.textContent = timeString;
            dateElement.textContent = dateString;
        }

        // Update the time and date every second
        setInterval(updateDateTime, 1000);

        // Initialize the time and date immediately
        updateDateTime();
    </script>
</body>
</html>
